name: CI

# One run per commit: push only fires on the integration branches, and
# pull_request has no branch filter so stacked PRs still run. Docs, skills and
# agent config never affect the build, so they start nothing. The `changes` job
# routes the rest.
on:
  pull_request:
    paths-ignore: &ignored
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
      - ".sigit/**"
      - "LICENSE-*"
  push:
    branches: [main, development]
    paths-ignore: *ignored
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the commit, not the ref: a merge lands the same SHA on development
  # and then on main, and keying on the ref put those in separate groups, so one
  # commit paid for two full macOS runs of identical code. Pull requests key on
  # their number instead, because there `github.sha` is the ephemeral merge
  # commit and changes with every push to the branch, which would leave
  # superseded runs alive.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "crates/**"
              - "uniffi-bindgen/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
              - "scripts/**"
              - ".github/workflows/ci.yml"
            workflows:
              - ".github/workflows/**"
              - ".github/scripts/**"

  actionlint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color

  check:
    name: Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: ed
    steps:
      - uses: actions/checkout@v6
        with:
          path: ed
      - name: Read Rust toolchain
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$rust_toolchain"
          echo "RUST_TOOLCHAIN=$rust_toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The action installs a minimal profile, so the pinned toolchain has
          # neither of these unless they are asked for by name.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ed
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  ci:
    name: CI status
    needs: [changes, actionlint, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in success|skipped) ;; *) echo "::error::job result: $result"; exit 1;; esac
          done
