name: Release SDK Rust (crates.io)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the selected existing release tag to crates.io"
        type: boolean
        default: false
      release_tag:
        description: "Existing vX.Y.Z tag to validate or publish on manual runs"
        type: string
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ed
    steps:
      - uses: actions/checkout@v6
        with:
          path: ed
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Read Rust toolchain
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$rust_toolchain"
          echo "RUST_TOOLCHAIN=$rust_toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Validate release tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$INPUT_RELEASE_TAG"
          fi
          test -n "$release_tag"
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git show-ref --verify --quiet "refs/tags/$release_tag"
          test "$(git rev-list -n 1 "$release_tag")" = "$(git rev-parse HEAD)"
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ed-agent"))')"
          test "${release_tag#v}" = "$version"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Publishing Ed means publishing two crates in dependency order, and plain
      # `cargo publish --dry-run` cannot cover the second one: packaging
      # rewrites ed-agent-tauri's path dependency on ed-agent into a registry
      # requirement, and `^1.0.0` cannot resolve until ed-agent is actually on
      # crates.io. A [patch] does not help, since packaging ignores it by
      # design. cargo-workspaces knows the order and its dry run warns about
      # the unpublished sibling rather than failing on it, so ed-agent still
      # gets a real packaging and verification pass here.
      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --version 0.4.2 --locked
      - name: Dry-run the workspace publish
        run: cargo workspaces publish --publish-as-is --dry-run --locked --allow-branch "*" --yes

  publish:
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ed
    steps:
      - uses: actions/checkout@v6
        with:
          path: ed
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Read Rust toolchain
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          test -n "$rust_toolchain"
          echo "RUST_TOOLCHAIN=$rust_toolchain" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-workspaces
        run: cargo install cargo-workspaces --version 0.4.2 --locked
      # `plan --skip-published` is what makes a re-run safe: it lists only the
      # crates still missing from crates.io, so a run that dies after ed-agent
      # went up publishes just ed-agent-tauri the second time.
      - name: Plan the publish
        id: plan
        run: |
          cargo workspaces plan --skip-published --json > plan.json
          cat plan.json
          echo "count=$(python3 -c 'import json; print(len(json.load(open("plan.json"))))')" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io
        if: steps.plan.outputs.count != '0'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish workspace crates
        if: steps.plan.outputs.count != '0'
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo workspaces publish \
            --publish-as-is \
            --yes \
            --locked \
            --allow-branch "*" \
            --publish-interval 15 \
            --token "$TOKEN"
      - name: Nothing to publish
        if: steps.plan.outputs.count == '0'
        run: echo "Every publishable crate at this version is already on crates.io."
