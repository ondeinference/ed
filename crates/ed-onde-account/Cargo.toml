[package]
name = "ed-onde-account"
description = "Onde Inference account client for Onde agents: sign in, list and activate apps, and mint an Onde Cloud API key through the ondeinference.com API. Holds no Onde secrets."
keywords = ["onde", "agent", "auth", "api-key"]
categories = ["api-bindings", "authentication"]
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# reqwest 0.13's `rustls` feature is the aws-lc provider, whose C code doesn't build for
# arm64_32 (`aws-lc-sys` takes it for a 64-bit limb target), and `ring` asserts 64-bit
# pointers on aarch64. watchOS uses `native-tls`, which is Security.framework and needs no
# rustls provider at all.
[target.'cfg(not(target_os = "watchos"))'.dependencies]
reqwest = { workspace = true, features = ["rustls"] }

[target.'cfg(target_os = "watchos")'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

[dev-dependencies]
axum = "0.8"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
