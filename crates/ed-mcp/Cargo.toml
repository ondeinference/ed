[package]
name = "ed-mcp"
description = "MCP for Onde agents: server configuration, tool namespacing, timeouts, progress and cancellation over rmcp, the official Rust SDK."
keywords = ["mcp", "llm", "agent", "onde"]
categories = ["asynchronous"]
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
agent-client-protocol = { workspace = true, optional = true }
ed-agent = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
http = "1"
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { workspace = true, features = ["sync", "time", "process", "macros", "io-std", "io-util", "rt"] }
tokio-util.workspace = true
futures.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true

# Spawning an MCP server as a child process needs `exec`, which Apple hides on tvOS (`libc`
# has no `execv` there, so `nix` under `process-wrap` doesn't compile). The stdio transport
# is everywhere else.
[target.'cfg(not(target_os = "tvos"))'.dependencies]
rmcp = { workspace = true, features = ["transport-child-process"] }

[features]
# Map ACP `session/new` MCP server lists (`McpToolset::connect`, `ServerSpec::from_acp`).
# Pulls in `agent-client-protocol`; `ed-acp` enables it.
acp = ["dep:agent-client-protocol"]
# `McpExecutor`: an `McpToolset` as Ed tools. Pulls in `ed-agent` (and with it `onde`).
agent = ["dep:ed-agent", "dep:async-trait"]
# A scriptable MCP server for tests: `echo`, `slow_progress`, `wait_for_cancel`, and the
# demucs-shaped `list_models` / `separate_stems`.
test-server = []

[dev-dependencies]
# `elicitation` adds the server peer's `create_elicitation`, so the in-process test server can
# ask the client for input and exercise the forwarding hook.
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server", "elicitation"] }
axum = "0.8"
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
# Run the feature-gated code's tests under a plain `cargo test`.
ed-mcp = { path = ".", features = ["acp", "agent", "test-server"] }
