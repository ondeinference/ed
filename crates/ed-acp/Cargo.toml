[package]
name = "ed-acp"
description = "Agent Client Protocol (ACP) v1 server for Onde agents: sessions, auth, the turn loop on Onde Cloud, tool approval, workspace tools and MCP. A product supplies a Profile."
keywords = ["acp", "agent", "llm", "onde", "mcp"]
categories = ["asynchronous", "development-tools"]
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# On-device inference with onde (`<PREFIX>_PROVIDER=local`). Off by default: it builds
# mistral.rs and its model runtime, which a cloud-only agent doesn't need.
local = ["dep:onde"]

[dependencies]
ed-mcp = { workspace = true, features = ["acp"] }
onde = { workspace = true, optional = true }
agent-client-protocol.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
directories.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
# Turn the `local` feature on for this crate's own tests.
ed-acp = { path = ".", features = ["local"] }
