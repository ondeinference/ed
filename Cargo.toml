[workspace]
resolver = "2"
members = ["crates/ed-agent", "crates/ed-agent-tauri"]

# Shared across every crate in the workspace so a release moves one number.
# `sync-version` tooling (see the Makefile) reads these.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
authors = ["Splitfire AB"]
repository = "https://github.com/ondeinference/ed"
homepage = "https://ondeinference.com"

[workspace.dependencies]
# The inference engine Ed wraps. Pinned to a published release: Ed itself is
# published, so a git or path dependency here would break `cargo publish`.
onde = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", features = [] }

# Internal
ed-agent = { version = "0.1.0", path = "crates/ed-agent" }
