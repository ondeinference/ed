[workspace]
resolver = "2"
members = [
    "crates/ed-agent",
    "crates/ed-agent-ffi",
    "crates/ed-agent-tauri",
    "crates/ed-mcp",
    "crates/ed-acp",
    "crates/ed-acp-tui",
    "crates/ed-acp-testkit",
    "uniffi-bindgen",
]

# Shared across every crate in the workspace so a release moves one number.
# `sync-version` tooling (see the Makefile) reads these.
[workspace.package]
version = "1.2.1"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = ["Splitfire AB"]
repository = "https://github.com/ondeinference/ed"
homepage = "https://ondeinference.com"

[workspace.dependencies]
# The inference engine Ed wraps, resolved from crates.io like any dependency
# (there is no path override to a sibling checkout). Release Onde's
# tool-calling API before publishing Ed.
onde = { version = "1.3.1" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
tauri = { version = "2", features = [] }
# Must match on the uniffi version `onde` is built with (=0.31.0). The
# bindgen extracts metadata that every crate in the staticlib embeds; mixed
# versions break extraction with "Invalid string data" errors.
uniffi = { version = "=0.31.0", features = ["tokio"] }
smbcloud-gresiq-sdk = "0.4.7"

# Onde Agent Platform v0.1 baseline (onde-web .agents/specs/onde-agent-platform, §5.4).
# The ACP crates (ed-mcp, ed-acp, ed-acp-tui, ed-acp-testkit) use these; ed-agent does not.
agent-client-protocol = "2.2"
rmcp = { version = "3.5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-util = "0.7"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
base64 = "0.23"

# Internal
ed-agent = { version = "1.2.1", path = "crates/ed-agent" }
ed-mcp = { version = "1.2.1", path = "crates/ed-mcp" }
ed-acp = { version = "1.2.1", path = "crates/ed-acp" }
ed-acp-tui = { version = "1.2.1", path = "crates/ed-acp-tui" }
ed-acp-testkit = { version = "1.2.1", path = "crates/ed-acp-testkit" }

# gemm-common (via candle, via onde) depends on sysctl for every
# `target_vendor = "apple"`, but sysctl 0.6.0 only has a `sys` module behind
# macOS/iOS/tvOS/visionOS/freeBSD — the watchOS build fails to resolve it. onde
# carries this same patch, but `[patch]` is only honoured from the manifest of
# the workspace being built, so depending on onde does not inherit it: Ed has to
# repeat it. The branch is cut from sysctl 0.6.0 rather than the fork's master
# (0.7.1) because a patch that is semver-incompatible with the requirement in
# the graph is silently ignored.
[patch.crates-io]
sysctl = { git = "https://github.com/setoelkahfi/sysctl-rs.git", branch = "feature/watchos-0.6" }
